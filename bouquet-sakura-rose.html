<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Bouquet For You</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--r1:#ff7b92;--r2:#e63950;--r3:#9c1128;--bg1:#25091a;--bg2:#6e2146;--card:#fff9f5;--ink:#5a1730}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'Playfair Display',Georgia,serif;color:#fff;background:radial-gradient(circle at 50% 15%,var(--bg2),var(--bg1) 78%);display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.script{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400}
.screen{display:none;width:100%;max-width:440px;text-align:center;animation:fade .9s ease;position:relative;z-index:1}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1{font-size:2.9rem;line-height:1.1;margin:8px 0;text-shadow:0 2px 16px rgba(255,150,180,.5)}
p.sub{opacity:.88;font-style:italic;margin-bottom:22px}
.bq{width:min(320px,82vw);margin:0 auto;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.5));animation:sway 6s ease-in-out infinite;transform-origin:50% 100%;overflow:visible}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.tw{animation:tw 2.4s ease-in-out infinite}.tw:nth-child(2n){animation-delay:.8s}.tw:nth-child(3n){animation-delay:1.5s}
@keyframes tw{50%{opacity:.25}}
button{font:inherit;cursor:pointer;border:0;border-radius:50px;padding:13px 30px;background:linear-gradient(135deg,#ff9bb0,#e63950);color:#fff;font-size:1.05rem;box-shadow:0 6px 20px rgba(230,57,80,.45);transition:transform .2s}
button:hover{transform:translateY(-2px) scale(1.03)}
button.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.55);box-shadow:none;padding:9px 20px;font-size:.9rem}
.card,.letter{background:var(--card);color:var(--ink);border-radius:24px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 2px #f3d2da;text-align:left}
.card h2{text-align:center;font-size:2.2rem;margin-bottom:12px;color:#c9254a}
label{display:block;font-size:.85rem;margin:12px 0 5px;font-weight:600}
input,textarea,select{width:100%;font:inherit;font-size:.95rem;padding:11px 13px;border:1px solid #e8c3cb;border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
.swatches{display:flex;gap:12px;margin-top:4px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #e8c3cb;padding:0}
.sw.sel{box-shadow:0 0 0 3px #c9254a}
.err{color:#c9254a;font-size:.8rem;min-height:1em;margin-top:6px}
.center{text-align:center;margin-top:18px}
.letter{margin-top:4px}
.letter .to{font-size:2.4rem;color:#c9254a}
.letter .msg{margin:12px 0;line-height:1.7;font-size:1.05rem;white-space:pre-wrap}
.letter .from{font-size:1.9rem;color:#c9254a;text-align:right}
.letter img{max-width:100%;max-height:230px;border-radius:14px;border:6px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25);margin:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.petal{position:fixed;top:-30px;opacity:.9;pointer-events:none;animation:fall linear forwards;z-index:0}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(600deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);padding:10px 20px;border-radius:30px;font-size:.9rem;opacity:0;transition:.3s;z-index:9;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <radialGradient id="gP" cx=".5" cy=".35" r=".75"><stop offset="0" style="stop-color:var(--r1)"/><stop offset="1" style="stop-color:var(--r2)"/></radialGradient>
  <radialGradient id="gD" cx=".5" cy=".5" r=".6"><stop offset="0" style="stop-color:var(--r2)"/><stop offset="1" style="stop-color:var(--r3)"/></radialGradient>
  <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffafc"/><stop offset=".55" stop-color="#ffd3df"/><stop offset="1" stop-color="#ff9db7"/></linearGradient>
  <linearGradient id="gW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde2e8"/><stop offset="1" stop-color="#f4a9bd"/></linearGradient>
  <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f8f5b"/><stop offset="1" stop-color="#1d5e3b"/></linearGradient>
  <path id="pet" d="M0 0C-27 -12 -34 -42 0 -48C34 -42 27 -12 0 0Z"/>
  <path id="spet" d="M0 0C-15 -9 -22 -30 -11 -44L0 -37L11 -44C22 -30 15 -9 0 0Z"/>

  <symbol id="rose" viewBox="-50 -50 100 100" overflow="visible">
    <circle r="47" fill="url(#gD)"/>
    <g fill="url(#gP)" stroke="var(--r3)" stroke-width="1" stroke-opacity=".5">
      <use href="#pet" transform="rotate(0)"/><use href="#pet" transform="rotate(60)"/><use href="#pet" transform="rotate(120)"/>
      <use href="#pet" transform="rotate(180)"/><use href="#pet" transform="rotate(240)"/><use href="#pet" transform="rotate(300)"/>
    </g>
    <g fill="url(#gP)" stroke="var(--r3)" stroke-width="1.2" stroke-opacity=".55">
      <use href="#pet" transform="rotate(25) scale(.72)"/><use href="#pet" transform="rotate(97) scale(.72)"/><use href="#pet" transform="rotate(169) scale(.72)"/>
      <use href="#pet" transform="rotate(241) scale(.72)"/><use href="#pet" transform="rotate(313) scale(.72)"/>
    </g>
    <g fill="var(--r2)" stroke="var(--r3)" stroke-width="1.4" stroke-opacity=".7">
      <use href="#pet" transform="rotate(50) scale(.45)"/><use href="#pet" transform="rotate(140) scale(.45)"/><use href="#pet" transform="rotate(230) scale(.45)"/><use href="#pet" transform="rotate(320) scale(.45)"/>
    </g>
    <path d="M0 0C-5 -6 3 -11 7 -5C10 2 0 8 -6 4" fill="none" stroke="var(--r3)" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-16" cy="-22" rx="13" ry="7" fill="#fff" opacity=".2" transform="rotate(-35 -16 -22)"/>
  </symbol>

  <symbol id="sak" viewBox="-50 -50 100 100" overflow="visible">
    <g fill="url(#gS)" stroke="#f08aa8" stroke-width="1" stroke-opacity=".7">
      <use href="#spet" transform="rotate(0)"/><use href="#spet" transform="rotate(72)"/><use href="#spet" transform="rotate(144)"/><use href="#spet" transform="rotate(216)"/><use href="#spet" transform="rotate(288)"/>
    </g>
    <g stroke="#f4879f" stroke-width="1" stroke-linecap="round" fill="none" opacity=".6">
      <path d="M0 -6V-28"/><path d="M0 -6V-28" transform="rotate(72)"/><path d="M0 -6V-28" transform="rotate(144)"/><path d="M0 -6V-28" transform="rotate(216)"/><path d="M0 -6V-28" transform="rotate(288)"/>
    </g>
    <circle r="7" fill="#e84a7a" opacity=".85"/>
    <g stroke="#c2255c" stroke-width="1" stroke-linecap="round">
      <path d="M0 0L-10 -14"/><path d="M0 0L-2 -17"/><path d="M0 0L9 -14"/><path d="M0 0L14 -3"/><path d="M0 0L-13 -3"/><path d="M0 0L-7 12"/><path d="M0 0L8 11"/>
    </g>
    <g fill="#ffd166"><circle cx="-10" cy="-14" r="2"/><circle cx="-2" cy="-17" r="2"/><circle cx="9" cy="-14" r="2"/><circle cx="14" cy="-3" r="2"/><circle cx="-13" cy="-3" r="2"/><circle cx="-7" cy="12" r="2"/><circle cx="8" cy="11" r="2"/></g>
  </symbol>

  <symbol id="leaf" viewBox="0 0 40 80"><path d="M20 78C-8 50 0 16 20 2C40 16 48 50 20 78Z" fill="url(#gL)"/><path d="M20 76V8M20 50L8 38M20 50L32 38M20 32L11 22M20 32L29 22" stroke="#7bc99c" stroke-width="1.3" fill="none" opacity=".7"/></symbol>
</defs>
</svg>

<template id="bqT">
<svg viewBox="0 0 320 410" class="bq">
  <!-- stems -->
  <g stroke="#2a7a4e" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M160 380Q158 250 160 110"/><path d="M160 380Q130 270 98 150"/><path d="M160 380Q190 270 222 150"/><path d="M160 380Q160 300 160 190"/>
    <path d="M160 380Q100 280 62 118"/><path d="M160 380Q220 280 258 118"/><path d="M160 380Q120 230 104 58"/><path d="M160 380Q200 230 216 58"/><path d="M160 380Q90 300 48 190"/><path d="M160 380Q230 300 272 190"/>
  </g>
  <!-- leaves -->
  <use href="#leaf" x="20" y="215" width="50" height="100" transform="rotate(-62 45 265)"/>
  <use href="#leaf" x="250" y="215" width="50" height="100" transform="rotate(62 275 265)"/>
  <use href="#leaf" x="64" y="195" width="44" height="88" transform="rotate(-38 86 240)"/>
  <use href="#leaf" x="212" y="195" width="44" height="88" transform="rotate(38 234 240)"/>
  <use href="#leaf" x="120" y="205" width="34" height="68" transform="rotate(-14 137 240)"/>
  <use href="#leaf" x="166" y="205" width="34" height="68" transform="rotate(14 183 240)"/>
  <!-- baby's breath -->
  <g fill="#fff" opacity=".95">
    <circle cx="20" cy="150" r="3.5"/><circle cx="30" cy="140" r="2.5"/><circle cx="14" cy="130" r="2.5"/><circle cx="300" cy="150" r="3.5"/><circle cx="292" cy="138" r="2.5"/><circle cx="306" cy="128" r="2.5"/>
    <circle cx="64" cy="30" r="3"/><circle cx="256" cy="30" r="3"/><circle cx="160" cy="12" r="3"/><circle cx="130" cy="20" r="2.2"/><circle cx="190" cy="20" r="2.2"/><circle cx="30" cy="232" r="3"/><circle cx="292" cy="232" r="3"/>
  </g>
  <!-- cherry blossoms -->
  <use href="#sak" x="32" y="88" width="62" height="62" transform="rotate(-12 63 119)"/>
  <use href="#sak" x="226" y="88" width="62" height="62" transform="rotate(14 257 119)"/>
  <use href="#sak" x="76" y="30" width="56" height="56" transform="rotate(20 104 58)"/>
  <use href="#sak" x="188" y="30" width="56" height="56" transform="rotate(-18 216 58)"/>
  <use href="#sak" x="20" y="162" width="58" height="58" transform="rotate(8 49 191)"/>
  <use href="#sak" x="242" y="162" width="58" height="58" transform="rotate(-10 271 191)"/>
  <!-- roses -->
  <use href="#rose" x="52" y="108" width="92" height="92" transform="rotate(-15 98 154)"/>
  <use href="#rose" x="176" y="108" width="92" height="92" transform="rotate(15 222 154)"/>
  <use href="#rose" x="108" y="56" width="104" height="104" transform="rotate(8 160 108)"/>
  <use href="#rose" x="112" y="142" width="96" height="96" transform="rotate(-8 160 190)"/>
  <!-- sparkles -->
  <g fill="#ffe9a8"><circle class="tw" cx="46" cy="70" r="2.5"/><circle class="tw" cx="276" cy="64" r="2.5"/><circle class="tw" cx="160" cy="40" r="2"/><circle class="tw" cx="22" cy="200" r="2"/><circle class="tw" cx="300" cy="206" r="2"/></g>
  <!-- wrapping -->
  <path d="M48 240Q160 262 272 240L190 398L130 398Z" fill="url(#gW)"/>
  <path d="M96 252Q160 268 224 252L172 398L148 398Z" fill="#fff3f6" opacity=".85"/>
  <path d="M48 240Q160 262 272 240" fill="none" stroke="#fff" stroke-width="2.5" opacity=".7"/>
  <!-- bow -->
  <path d="M160 318C122 286 102 318 124 334C142 346 156 328 160 322C164 328 178 346 196 334C218 318 198 286 160 318Z" fill="#e63950" stroke="#a8132b" stroke-width="1.5"/>
  <path d="M158 328L136 372L150 366L158 380ZM162 328L184 372L170 366L162 380Z" fill="#c9254a"/>
  <circle cx="160" cy="324" r="9" fill="#ff6b81" stroke="#a8132b" stroke-width="1.5"/>
</svg>
</template>

<!-- Screen 1: Intro -->
<section class="screen on" id="s1">
  <div class="bqHolder"></div>
  <h1 class="script" id="introTitle">A bouquet for someone special</h1>
  <p class="sub" id="introSub">Every rose and blossom here carries a little piece of my heart.</p>
  <button id="openBtn">Open with love ♥</button>
</section>

<!-- Screen 2: Form -->
<section class="screen" id="s2">
  <div class="card">
    <h2 class="script">Write your greeting</h2>
    <label for="to">Who is this for?</label>
    <input id="to" maxlength="40" placeholder="Their name or nickname">
    <label for="from">From</label>
    <input id="from" maxlength="40" placeholder="Your name (or a secret admirer note)">
    <label for="tpl">Pick a message idea (optional)</label>
    <select id="tpl">
      <option value="">— Write my own —</option>
      <option>Every time I see you smile, my whole day gets brighter. These flowers could never match how beautiful you are to me.</option>
      <option>I may not say it often, but you make my heart skip every single day. Will you let me love you a little more tomorrow?</option>
      <option>You are my favorite hello and my hardest goodbye. I'm so happy to have you in my life.</option>
      <option>Roses for my love, blossoms for my wish: that I get to stay by your side, always.</option>
    </select>
    <label for="msg">Your message</label>
    <textarea id="msg" maxlength="400" placeholder="Pour your heart out here…"></textarea>
    <label>Rose color</label>
    <div class="swatches" id="sws">
      <button type="button" class="sw sel" data-c="red" style="background:#e63950" aria-label="Red"></button>
      <button type="button" class="sw" data-c="pink" style="background:#f78fb3" aria-label="Pink"></button>
      <button type="button" class="sw" data-c="peach" style="background:#ffa07a" aria-label="Peach"></button>
      <button type="button" class="sw" data-c="purple" style="background:#a367dc" aria-label="Purple"></button>
    </div>
    <label for="pic">Add a photo (optional, shown only on your device)</label>
    <input type="file" id="pic" accept="image/*">
    <div class="err" id="err"></div>
    <div class="center"><button id="makeBtn">Create my bouquet 🌹</button></div>
  </div>
</section>

<!-- Screen 3: Result -->
<section class="screen" id="s3">
  <div class="bqHolder"></div>
  <div class="letter">
    <div class="to script" id="rTo"></div>
    <img id="rPic" alt="" style="display:none">
    <div class="msg" id="rMsg"></div>
    <div class="from script" id="rFrom"></div>
  </div>
  <div class="actions" id="actSender">
    <button id="copyBtn">Copy link to send 💌</button>
    <button class="ghost" id="shareBtn">Share</button>
    <button class="ghost" id="againBtn">Create another</button>
  </div>
  <div class="actions" id="actReceiver" style="display:none">
    <button class="ghost" id="replyBtn">Send one back 🌹</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const PAL={red:['#ff7b92','#e63950','#9c1128'],pink:['#ffc6d8','#f78fb3','#c2456f'],peach:['#ffd5b0','#ffa07a','#d4603a'],purple:['#dcc0ff','#a367dc','#6a2fa8']};
let color='red', data=null, photo='';

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}
function setColor(c){color=c;const p=PAL[c]||PAL.red;['--r1','--r2','--r3'].forEach((v,i)=>document.documentElement.style.setProperty(v,p[i]))}
document.querySelectorAll('.bqHolder').forEach(h=>h.appendChild($('bqT').content.cloneNode(true)));

function petals(n){
  const rose=PAL[color];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='petal';
    const sak=i%2===0, s=10+Math.random()*10;
    p.style.width=s+'px';p.style.height=s*1.25+'px';
    p.style.borderRadius=sak?'60% 60% 50% 50% / 80% 80% 30% 30%':'70% 0 70% 0';
    p.style.background=sak?'linear-gradient(#fff,#ffb3c7)':rose[1+(i%2)];
    p.style.left=Math.random()*100+'vw';
    p.style.setProperty('--dx',(Math.random()*180-90)+'px');
    p.style.animationDuration=(6+Math.random()*6)+'s';p.style.animationDelay=Math.random()*3+'s';
    document.body.appendChild(p);setTimeout(()=>p.remove(),14000);
  }
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}

function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
function link(){return location.href.split('#')[0]+'#'+enc(data)}

function render(d,receiver){
  setColor(d.c);
  $('rTo').textContent='Dear '+d.to+',';
  $('rMsg').textContent=d.msg;
  $('rFrom').textContent='— '+d.from;
  const img=$('rPic');
  if(!receiver&&photo){img.src=photo;img.style.display='block'}else img.style.display='none';
  $('actSender').style.display=receiver?'none':'flex';
  $('actReceiver').style.display=receiver?'flex':'none';
  show('s3');petals(34);
}

$('sws').addEventListener('click',e=>{
  const b=e.target.closest('.sw');if(!b)return;
  document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');setColor(b.dataset.c);
});
$('tpl').addEventListener('change',e=>{if(e.target.value)$('msg').value=e.target.value});
$('pic').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f){photo='';return}
  const r=new FileReader();r.onload=()=>photo=r.result;r.readAsDataURL(f);
});
$('openBtn').onclick=()=>{ if(data){render(data,true)}else{show('s2');petals(16)} };
$('makeBtn').onclick=()=>{
  const to=$('to').value.trim(),from=$('from').value.trim(),msg=$('msg').value.trim();
  if(!to||!from||!msg){$('err').textContent='Please fill in the name, your name, and your message.';return}
  $('err').textContent='';
  data={to,from,msg,c:color};
  render(data,false);
};
$('copyBtn').onclick=async()=>{
  try{await navigator.clipboard.writeText(link());toast('Link copied! Send it to your special someone 💕')}
  catch(e){prompt('Copy this link:',link())}
};
$('shareBtn').onclick=()=>{
  if(navigator.share)navigator.share({title:'A bouquet for you',text:'I made something for you 🌹🌸',url:link()}).catch(()=>{});
  else $('copyBtn').click();
};
$('againBtn').onclick=()=>{data=null;photo='';['to','from','msg','pic'].forEach(i=>$(i).value='');$('tpl').value='';show('s2')};
$('replyBtn').onclick=()=>{data=null;history.replaceState(null,'',location.pathname);show('s2')};

(function(){
  if(location.hash.length>1){
    try{
      data=dec(location.hash.slice(1));setColor(data.c);
      $('introTitle').textContent='A bouquet for '+data.to;
      $('introSub').textContent='Someone special picked these flowers just for you.';
    }catch(e){data=null}
  }
  petals(14);
})();
</script>
</body>
</html>
